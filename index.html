
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blue Fig | AI Concierge</title>
    <!-- Shim to prevent "process is not defined" error in SDKs -->
    <script>
      window.process = { env: { API_KEY: "" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #fcf9f2;
        color: #1e293b;
        background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
      }
      .font-playfair { font-family: 'Playfair Display', serif; }
      .font-cairo { font-family: 'Cairo', sans-serif; }
      
      @keyframes pulse-fig {
        0% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.4); }
        70% { transform: scale(1.05); opacity: 0.8; box-shadow: 0 0 40px 20px rgba(194, 65, 12, 0); }
        100% { transform: scale(1); opacity: 0.6; box-shadow: 0 0 0 0 rgba(30, 58, 138, 0); }
      }
      .animate-pulse-fig {
        animation: pulse-fig 3s infinite ease-in-out;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
      }

      .text-glow {
        text-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
      }
    </style>
  <script type="importmap">
{

  }
}
</script>
</head>
